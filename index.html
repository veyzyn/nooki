<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple local Minecraft server manager for Windows." />
    <link rel="icon" type="image/svg+xml" href="/src/assets/nooki-logo.svg" />
    <title>Nooki</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0b0d;
      }

      #nooki-startup {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #0b0b0d;
        color: #ededef;
        font-family: "Geist Variable", "Segoe UI Variable Text", "Segoe UI", sans-serif;
        opacity: 1;
        /* Hand-off to the app: a quick fade on the strong ease-out curve. */
        transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      #nooki-startup.is-ready {
        pointer-events: none;
        opacity: 0;
      }

      .nooki-startup-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        transform: translateY(-8px);
      }

      .nooki-startup-logo {
        width: 44px;
        height: 44px;
      }

      .nooki-startup-name {
        margin-top: 1px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .nooki-startup-status {
        color: #9d9da6;
        font-size: 12px;
        font-weight: 400;
      }

      .nooki-startup-spinner {
        width: 16px;
        height: 16px;
        margin-top: 6px;
        color: #ededef;
        animation: nooki-startup-spin 700ms linear infinite;
      }

      @keyframes nooki-startup-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        #nooki-startup { transition: none; }
        .nooki-startup-spinner { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="nooki-startup" role="status" aria-live="polite" aria-label="Nooki is starting">
      <div class="nooki-startup-content">
        <svg class="nooki-startup-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect width="28" height="28" rx="6" fill="#1c2c25" />
          <rect x="1" y="1" width="26" height="26" rx="5.5" stroke="#2c5239" />
          <path d="M7.5 20.5v-13l13 13v-13" stroke="#5fb87f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div class="nooki-startup-name">Nooki</div>
        <div class="nooki-startup-status">Loading your servers</div>
        <svg class="nooki-startup-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="#26262b" stroke-width="2" />
          <path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
