name: Build Nooki

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: build-nooki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    name: Quality checks
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify publishable source
        shell: pwsh
        run: |
          $privatePaths = @(
            "private",
            "src-private",
            ".cargo/config.toml"
          )

          $foundPaths = $privatePaths | Where-Object { Test-Path -LiteralPath $_ }
          if ($foundPaths) {
            Write-Error "Private-edition files are present: $($foundPaths -join ', ')"
            exit 1
          }

          $trackedRelaySecrets = & git ls-files -- relay/relay.env relay/data
          if ($trackedRelaySecrets) {
            $trackedRelaySecrets | Write-Host
            Write-Error "Production relay credentials or activation records are tracked."
            exit 1
          }

          $matches = & git grep -n -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- .
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Host
            Write-Error "A private key or build credential appears to be committed."
            exit 1
          }
          if ($LASTEXITCODE -gt 1) {
            exit $LASTEXITCODE
          }
          exit 0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum

      - name: Test relay service
        working-directory: relay
        run: go test ./...

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        shell: pwsh
        run: |
          pnpm build
          pnpm test

      - name: Run Rust checks
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

  windows-portable:
    name: Windows x64 portable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify publishable source
        shell: pwsh
        run: |
          $privatePaths = @(
            "private",
            "src-private",
            ".cargo/config.toml"
          )

          $foundPaths = $privatePaths | Where-Object { Test-Path -LiteralPath $_ }
          if ($foundPaths) {
            Write-Error "Private-edition files are present: $($foundPaths -join ', ')"
            exit 1
          }

          $trackedRelaySecrets = & git ls-files -- relay/relay.env relay/data
          if ($trackedRelaySecrets) {
            $trackedRelaySecrets | Write-Host
            Write-Error "Production relay credentials or activation records are tracked."
            exit 1
          }

          $matches = & git grep -n -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- .
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Host
            Write-Error "A private key or build credential appears to be committed."
            exit 1
          }
          if ($LASTEXITCODE -gt 1) {
            exit $LASTEXITCODE
          }
          exit 0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable executable
        shell: pwsh
        env:
          BUILD_CONTACT: ${{ vars.NOOKI_CONTACT_URL || 'nooki@mints.wtf' }}
          BUILD_CURSEFORGE_KEY: ${{ secrets.NOOKI_CURSEFORGE_API_KEY }}
        run: |
          if ($env:BUILD_CONTACT) {
            $env:NOOKI_CONTACT_URL = $env:BUILD_CONTACT
          }
          if ($env:BUILD_CURSEFORGE_KEY) {
            $env:NOOKI_CURSEFORGE_API_KEY = $env:BUILD_CURSEFORGE_KEY
          }

          pnpm tauri build --no-bundle
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/nooki.exe -Destination artifacts/Nooki-Windows-x64.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nooki-Windows-x64
          path: artifacts/Nooki-Windows-x64.exe
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      GH_REPO: ${{ github.repository }}
    needs:
      - checks
      - windows-portable
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Windows executable
        uses: actions/download-artifact@v7
        with:
          name: Nooki-Windows-x64
          path: artifacts

      - name: Publish development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="development"
          repository="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          asset="artifacts/Nooki-Windows-x64.exe"

          if gh api "repos/$repository/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repository/git/refs/tags/$tag" -f sha="$sha" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repository/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
          fi

          notes=$(cat <<EOF
          Automatic Windows build from the latest commit on \`main\`.

          Commit: [$sha](https://github.com/$repository/commit/$sha)

          This is a development build and may be less stable than a versioned release.
          EOF
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "Nooki Development Build" --notes "$notes" --prerelease
          else
            gh release create "$tag" "$asset" --verify-tag --title "Nooki Development Build" --notes "$notes" --prerelease
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          asset="artifacts/Nooki-Windows-x64.exe"

          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "Nooki $tag" --notes-file release-notes.md
          else
            gh release create "$tag" "$asset" --verify-tag --title "Nooki $tag" --notes-file release-notes.md
          fi
