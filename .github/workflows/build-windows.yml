name: Build community edition

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows x64 portable
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify publishable source
        shell: pwsh
        run: |
          $privatePaths = @(
            "private",
            "src-private",
            ".cargo/config.toml"
          )

          $foundPaths = $privatePaths | Where-Object { Test-Path -LiteralPath $_ }
          if ($foundPaths) {
            Write-Error "Private-edition files are present: $($foundPaths -join ', ')"
            exit 1
          }

          $matches = & git grep -n -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- .
          if ($LASTEXITCODE -eq 0) {
            $matches | Write-Host
            Write-Error "A private key or build credential appears to be committed."
            exit 1
          }
          if ($LASTEXITCODE -gt 1) {
            exit $LASTEXITCODE
          }

      - name: Install pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        shell: pwsh
        run: |
          pnpm build
          pnpm test

      - name: Run Rust checks
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable executable
        shell: pwsh
        env:
          BUILD_CONTACT: ${{ vars.NOOKI_CONTACT_URL }}
          BUILD_CURSEFORGE_KEY: ${{ secrets.NOOKI_CURSEFORGE_API_KEY }}
        run: |
          if ($env:BUILD_CONTACT) {
            $env:NOOKI_CONTACT_URL = $env:BUILD_CONTACT
          }
          if ($env:BUILD_CURSEFORGE_KEY) {
            $env:NOOKI_CURSEFORGE_API_KEY = $env:BUILD_CURSEFORGE_KEY
          }

          pnpm tauri build --no-bundle
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/nooki.exe -Destination artifacts/Nooki-Windows-x64.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Nooki-Windows-x64.exe
          archive: false
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/Nooki-Windows-x64.exe --clobber
          } else {
            gh release create $tag artifacts/Nooki-Windows-x64.exe --verify-tag --generate-notes --title "Nooki $tag"
          }
